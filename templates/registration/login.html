{% extends "base.html" %}
{% block title %}Accedi{% endblock %}

{% block content %}
<section class="login">
  <h1>Accedi</h1>
  <form method="post" class="stack">
    {% csrf_token %}
    {% if form.non_field_errors %}
      <p class="error" role="alert">{{ form.non_field_errors.0 }}</p>
    {% endif %}
    <div class="field">
      <label for="{{ form.username.id_for_label }}">Nome utente</label>
      {{ form.username }}
    </div>
    <div class="field">
      <label for="{{ form.password.id_for_label }}">Password</label>
      {{ form.password }}
    </div>
    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
    <button class="btn btn-primary" type="submit">Accedi</button>
  </form>
</section>
{% endblock %}
